# 전체 구축 전 읽기 전용 검사입니다. inventory.ini의 config_sources와 lab 그룹을 사용합니다.
---
# inventory 누락으로 원본 검사가 통째로 건너뛰어지는 것을 막습니다.
- name: 필수 inventory 그룹 확인
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: 원본 한 대와 대상 한 대 이상 확인
      ansible.builtin.assert:
        that:
          - groups.get('config_sources', []) | length == 1
          - groups.get('lab', []) | length > 0
        fail_msg: inventory.ini에 config_sources 원본 한 대와 lab 대상 한 대 이상을 지정하세요.

- name: 수집 원본 사전 검사
  hosts: config_sources
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars/environment.yml, vars/services.yml]
  tasks:
    - name: 원본 서버 한 대와 role 선택 확인
      ansible.builtin.assert:
        that:
          - groups.config_sources | length == 1
          - enabled_roles | length > 0
          - enabled_roles | difference(['nginx', 'common_services']) | length == 0
    - name: 원본 rsync 확인
      ansible.builtin.command:
        argv: [rsync, --version]
      changed_when: false
    - name: 원본 폴더 존재와 접근 권한 확인
      ansible.builtin.command:
        # 원본 SSH 계정으로 읽기·진입 가능한 디렉터리인지 검사합니다.
        argv: [/usr/bin/python3.9, -c, 'import os,sys; p=sys.argv[1]; sys.exit(0 if os.path.isdir(p) and os.access(p,os.R_OK|os.X_OK) else 1)', '{{ item }}']
      loop: '{{ [nginx_source_config_dir, nginx_source_static_dir] if "nginx" in enabled_roles else [] }}'
      # 관리자 수집 모드에서는 fetch에서 원본 경로를 관리자 권한으로 검사합니다.
      when: not nginx_source_use_sudo | bool
      changed_when: false
    - name: 공통 서비스 정의 검사
      ansible.builtin.import_tasks: roles/common_services/tasks/validate.yml
      when: '"common_services" in enabled_roles'
    - name: 공통 서비스 원본과 실행 파일 확인
      ansible.builtin.include_tasks: tasks/preflight-service.yml
      loop: '{{ common_services }}'
      loop_control:
        loop_var: service
        label: '{{ service.name }}'
      when: "'common_services' in enabled_roles"
    - name: control rsync 확인
      ansible.builtin.command:
        argv: [rsync, --version]
      delegate_to: localhost
      changed_when: false

- name: 신규 구축 대상 사전 검사
  hosts: lab
  gather_facts: false
  any_errors_fatal: true
  vars_files: [vars/environment.yml, vars/services.yml]
  tasks:
    - name: 대상 검사 작업 실행
      ansible.builtin.import_tasks: tasks/preflight-target.yml
