# 서비스 정의 검증은 사전 검사와 실제 실행에서 함께 사용합니다.
---
- name: 서비스 정의 검사
  ansible.builtin.import_tasks: validate.yml
# 실행 로그에 표시할 작업 이름입니다.
- name: 공통 서비스 단계 선택
  # 이 경로의 작업 목록을 불러옵니다. {{ deployment_phase }}는 선택한 단계 이름입니다.
  ansible.builtin.include_tasks: '{{ deployment_phase }}.yml'
  # 목록 항목마다 이 작업을 반복합니다. enabled_roles는 role 목록, common_services는 서비스 목록입니다. 기본 현재 항목은 item입니다.
  loop: '{{ common_services }}'
  # 반복 변수의 이름과 화면에 표시할 이름을 설정합니다.
  loop_control:
    # 기본 반복 변수 item 대신 이 이름으로 현재 항목을 참조합니다.
    loop_var: service
    # 반복 작업 로그에 서비스 이름만 표시해 읽기 쉽게 합니다.
    label: '{{ service.name }}'
