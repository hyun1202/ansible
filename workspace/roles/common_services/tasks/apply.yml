# 이 파일은 키 계정으로만 실행합니다. su와 sudo를 사용하지 않습니다.
---
- name: 현재 서비스의 작업 결과 초기화
  ansible.builtin.set_fact:
    service_stage: {}
- name: 키 계정으로 공통 서비스 배치와 실행
  become: false
  # 스크립트에서 Java 11을 사용합니다. 시스템 기본 Java는 변경하지 않습니다.
  environment:
    JAVA_HOME: '{{ java_home }}'
    PATH: '{{ java_home }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  block:
    - name: 키 계정과 서비스 실행 계정 일치 확인
      ansible.builtin.assert:
        that:
          - service.owner == ansible_user
          - service.start_user | default(service.owner) == ansible_user
        fail_msg: 공통 서비스는 키 접속 계정 소유로 배치하고 같은 계정으로 실행해야 합니다.
    - name: 서비스 폴더 소유권 조회
      ansible.builtin.stat:
        path: '{{ service.path }}'
        follow: false
      register: service_directory
    - name: 일반 계정이 관리할 서비스 폴더인지 확인
      ansible.builtin.assert:
        that:
          - service_directory.stat.isdir | default(false)
          - not (service_directory.stat.islnk | default(false))
          - service_directory.stat.pw_name | default('') == ansible_user
          - service_directory.stat.gr_name | default('') == service.group
        fail_msg: install.yml로 서비스 폴더를 먼저 준비하세요. 기존 폴더 소유권은 자동으로 변경하지 않습니다.
    - name: 업로드된 파일 확인
      ansible.builtin.stat:
        path: '{{ staging_root }}/common_services/{{ service.name }}/files'
      register: service_upload
    - name: 업로드 확인
      ansible.builtin.assert:
        that: service_upload.stat.isdir | default(false)
        fail_msg: upload.yml을 먼저 실행하세요.
    - name: 서비스 작업 폴더 준비
      ansible.builtin.tempfile:
        state: directory
        path: '{{ staging_root }}'
        prefix: '{{ service.name }}-'
      register: service_stage
    - name: 업로드 사본 준비
      ansible.builtin.copy:
        src: '{{ staging_root }}/common_services/{{ service.name }}/files/'
        dest: '{{ service_stage.path }}/payload/'
        remote_src: true
        mode: preserve
        local_follow: false
        follow: false
    - name: 기존 서비스 폴더의 내용 확인
      ansible.builtin.find:
        paths: '{{ service.path }}'
        file_type: any
        hidden: true
        recurse: false
      register: existing_entries
    - name: 기존 서비스 종료
      ansible.builtin.command:
        argv: '{{ service.stop_argv }}'
        chdir: '{{ service.path }}'
      # install이 새로 만든 빈 폴더에는 종료할 서비스가 없습니다.
      when:
        - existing_entries.matched > 0
        - service.stop_argv | default([]) | length > 0
    - name: 기존 서비스 내용 백업
      ansible.builtin.copy:
        src: '{{ service.path }}/'
        dest: '{{ service_stage.path }}/previous/'
        remote_src: true
        mode: preserve
        local_follow: false
        follow: false
    # /srv 자체에 쓰기 권한을 요구하지 않도록 서비스 폴더를 유지하고 내부만 교체합니다.
    - name: 백업한 기존 내용 제거
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: absent
      loop: '{{ existing_entries.files }}'
      loop_control:
        label: '{{ item.path }}'
    - name: 새 서비스 내용 배치
      ansible.builtin.copy:
        src: '{{ service_stage.path }}/payload/'
        dest: '{{ service.path }}/'
        remote_src: true
        mode: preserve
        local_follow: false
        follow: false
    - name: 서비스 시작
      ansible.builtin.command:
        argv: '{{ service.start_argv }}'
        chdir: '{{ service.path }}'
      when: service.start_argv | default([]) | length > 0
    - name: 서비스 정상 동작 확인
      ansible.builtin.command:
        argv: '{{ service.check_argv }}'
        chdir: '{{ service.path }}'
      when: service.check_argv | default([]) | length > 0
      register: service_check
      changed_when: false
      retries: 5
      delay: 2
      until: service_check.rc == 0
  rescue:
    - name: 공통 서비스 반영 실패 안내
      ansible.builtin.fail:
        msg: '{{ service.name }} 반영 실패. 작업·백업 경로: {{ service_stage.path | default("생성 전") }}. 자동 원복·재기동하지 않았습니다.'
- name: 서비스 반영 결과
  ansible.builtin.debug:
    msg: >-
      {{ service.name }} → {{ service.path }} 배치 완료.
      백업: {{ service_stage.path }}/previous.
      {{ '시작 명령 완료' if service.start_argv | default([]) | length > 0 else '파일 배치만 수행' }} /
      {{ '검증 명령 통과' if service.check_argv | default([]) | length > 0 else '검증 명령 미설정' }}
