---
- name: 현재 서비스의 작업 결과 초기화
  ansible.builtin.set_fact:
    service_stage: {}
- name: 관리자 전환 후 서비스 파일 배치와 실행
  become: true
  become_method: su
  become_user: '{{ admin_user }}'
  no_log: true
  module_defaults:
    ansible.builtin.command:
      stdin: '{{ admin_sudo_password }}'
  block:
  - name: 서비스 업로드 폴더 확인
    ansible.builtin.command:
      argv: [sudo, -S, -k, -p, '', --, test, -d, '{{ staging_root }}/common_services/{{ service.name }}/files']
    changed_when: false
  - name: 최종 경로의 상위 디렉터리 준비
    ansible.builtin.command:
      argv: [sudo, -S, -k, -p, '', --, mkdir, -p, '{{ service.path | dirname }}']
  - name: 서비스 작업 폴더 생성
    ansible.builtin.command:
      argv: [sudo, -S, -k, -p, '', --, mktemp, -d, '{{ service.path | dirname }}/.ansible-{{ service.name }}.XXXXXX']
    register: service_stage
  - name: 업로드 파일을 관리자 작업 폴더로 복사
    ansible.builtin.command:
      argv: [sudo, -S, -k, -p, '', --, cp, -a, --no-preserve=ownership, '{{ staging_root }}/common_services/{{ service.name }}/files',
        '{{ service_stage.stdout }}/payload']
  - name: 배치할 파일 소유권 설정
    ansible.builtin.command:
      argv: [sudo, -S, -k, -p, '', --, chown, -R, '{{ service.owner }}:{{ service.group }}', '{{ service_stage.stdout }}/payload']
  - name: 기존 서비스 폴더 확인
    ansible.builtin.command:
      argv: [sudo, -S, -k, -p, '', --, test, -d, '{{ service.path }}']
    register: service_existing
    changed_when: false
    failed_when: service_existing.rc not in [0, 1]
  - name: 기존 서비스 폴더 백업
    ansible.builtin.command:
      argv: [sudo, -S, -k, -p, '', --, cp, -a, '{{ service.path }}', '{{ service_stage.stdout }}/previous']
    when: service_existing.rc == 0
  - name: 서비스 최종 경로 준비
    ansible.builtin.command:
      argv: [sudo, -S, -k, -p, '', --, mkdir, -p, '{{ service.path }}']
  - name: 서비스 파일 최종 배치
    ansible.builtin.command:
      argv: [sudo, -S, -k, -p, '', --, cp, -a, '{{ service_stage.stdout }}/payload/.', '{{ service.path }}/']
  - name: 지정한 계정으로 서비스 실행
    ansible.builtin.command:
      argv: '{{ [''sudo'', ''-S'', ''-k'', ''-p'', '''', ''-u'', service.start_user | default(service.owner), ''--'', ''/bin/sh'', ''-c'',
        ''cd "$1" && shift && exec "$@"'', ''sh'', service.path] + service.start_argv }}'
    when: service.start_argv | default([]) | length > 0
  - name: 서비스 정상 기동 확인
    ansible.builtin.command:
      argv: '{{ [''sudo'', ''-S'', ''-k'', ''-p'', '''', ''-u'', service.start_user | default(service.owner), ''--'', ''/bin/sh'', ''-c'',
        ''cd "$1" && shift && exec "$@"'', ''sh'', service.path] + service.check_argv }}'
    when: service.check_argv | default([]) | length > 0
    changed_when: false
    register: service_check
    retries: 5
    delay: 2
    until: service_check.rc == 0
  rescue:
  - name: 공통 서비스 적용 실패로 중단
    ansible.builtin.fail:
      msg: '{{ service.name }} 적용 실패. 작업·백업 경로: {{ service_stage.stdout | default("생성 전") }}. 자동 중지·원복하지 않았습니다.'
    no_log: false
- name: 서비스 적용 결과
  ansible.builtin.debug:
    msg: '{{ service.name }} → {{ service.path }} 배치 완료. 작업·백업: {{ service_stage.stdout }}'
