# Ansible YAML: 들여쓰기는 소속 관계, -는 목록 항목, {{ 변수 }}는 실행 시 값 치환을 뜻합니다.
---
# 실행 로그에 표시할 작업 이름입니다.
- name: 서비스 이름 중복 확인
  # 조건이 참인지 검사하며 거짓이면 해당 작업을 실패시킵니다.
  ansible.builtin.assert:
    # 아래 조건이 모두 참이어야 통과합니다.
    that:
    # name만 추출(map)해 목록(list)으로 만든 뒤 중복 제거(unique) 전후 개수(length)를 비교합니다.
    - common_services | map(attribute="name") | list | unique | length == common_services | length
# 실행 로그에 표시할 작업 이름입니다.
- name: 서비스 경로와 계정 확인
  # 조건이 참인지 검사하며 거짓이면 해당 작업을 실패시킵니다.
  ansible.builtin.assert:
    # 아래 조건이 모두 참이어야 통과합니다.
    that:
    # 서비스 이름은 영문·숫자·밑줄·하이픈으로만 구성해야 합니다.
    - service.name is match('^[a-zA-Z0-9_-]+$')
    # 경로가 /로 시작하는 절대 경로인지 확인합니다.
    - service.path is match('^/')
    # 파일 시스템 최상위 / 자체를 배치 대상으로 지정하지 못하게 합니다.
    - service.path != '/'
    # 상위 디렉터리로 이동하는 /../ 구간이 경로에 포함되지 않았는지 확인합니다.
    - '''/../'' not in service.path'
    # 파일 소유 계정 이름이 빈 문자열이 아닌지 확인합니다.
    - service.owner | length > 0
    # 파일 소유 그룹 이름이 빈 문자열이 아닌지 확인합니다.
    - service.group | length > 0
    # assert 조건이 거짓일 때 표시할 안내 문구입니다.
    fail_msg: 서비스 name, 절대 path, owner, group을 확인하세요.
  # 목록 항목마다 이 작업을 반복합니다. enabled_roles는 role 목록, common_services는 서비스 목록입니다. 기본 현재 항목은 item입니다.
  loop: '{{ common_services }}'
  # 반복 변수의 이름과 화면에 표시할 이름을 설정합니다.
  loop_control:
    # 기본 반복 변수 item 대신 이 이름으로 현재 항목을 참조합니다.
    loop_var: service
    # 반복 작업 로그에 서비스 이름만 표시해 읽기 쉽게 합니다.
    label: '{{ service.name }}'
# 실행 명령은 쉘 문자열이 아닌 argv 목록이어야 합니다.
- name: 서비스 명령 형식 확인
  ansible.builtin.assert:
    that:
      - service.start_argv | default([]) is sequence and service.start_argv | default([]) is not string and service.start_argv | default([]) is not mapping
      - service.stop_argv | default([]) is sequence and service.stop_argv | default([]) is not string and service.stop_argv | default([]) is not mapping
      - service.check_argv | default([]) is sequence and service.check_argv | default([]) is not string and service.check_argv | default([]) is not mapping
      - service.start_argv | default([]) | length == 0 or service.stop_argv | default([]) | length > 0
    fail_msg: start_argv·stop_argv·check_argv는 목록으로 적으세요. 시작할 서비스에는 종료 명령도 필요합니다.
  loop: '{{ common_services }}'
  loop_control:
    loop_var: service
    label: '{{ service.name }}'
