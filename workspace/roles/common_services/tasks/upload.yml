---
- name: 서비스 수집 완료 확인
  ansible.builtin.stat:
    path: '{{ collection_root }}/common_services/{{ service.name }}/.complete'
  delegate_to: localhost
  register: service_collected
- name: 미수집 서비스 업로드 차단
  ansible.builtin.assert:
    that:
    - service_collected.stat.exists
    fail_msg: 먼저 fetch.yml을 실행하세요.
- name: 서비스 업로드 폴더 준비
  ansible.builtin.file:
    path: '{{ staging_root }}/common_services/{{ service.name }}'
    state: directory
    mode: '0700'
- name: 서비스 디렉터리 업로드
  ansible.posix.synchronize:
    mode: push
    src: '{{ collection_root }}/common_services/{{ service.name }}/files/'
    dest: '{{ staging_root }}/common_services/{{ service.name }}/files/'
    archive: true
    owner: false
    group: false
    delete: true
    use_ssh_args: true
    verify_host: true
