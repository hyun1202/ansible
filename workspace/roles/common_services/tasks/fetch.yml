# Ansible YAML: 들여쓰기는 소속 관계, -는 목록 항목, {{ 변수 }}는 실행 시 값 치환을 뜻합니다.
---
# 실행 로그에 표시할 작업 이름입니다.
- name: 서비스 수집 폴더 준비
  # 파일 또는 디렉터리의 존재 여부와 권한을 관리합니다.
  ansible.builtin.file:
    # 작업이 조회하거나 만들 경로입니다. {{ }} 안의 변수는 실제 경로로 치환됩니다.
    path: '{{ collection_root }}/common_services/{{ service.name }}'
    # directory는 디렉터리 생성·유지, absent는 해당 경로 삭제를 뜻합니다.
    state: directory
    # 소유자만 읽기·쓰기·진입 가능한 디렉터리 권한입니다.
    mode: '0700'
  # 이 작업만 대상 서버 대신 control(localhost)에서 실행합니다.
  delegate_to: localhost
# 실행 로그에 표시할 작업 이름입니다.
- name: 이전 수집 완료 표시 제거
  # 파일 또는 디렉터리의 존재 여부와 권한을 관리합니다.
  ansible.builtin.file:
    # 작업이 조회하거나 만들 경로입니다. {{ }} 안의 변수는 실제 경로로 치환됩니다.
    path: '{{ collection_root }}/common_services/{{ service.name }}/.complete'
    # directory는 디렉터리 생성·유지, absent는 해당 경로 삭제를 뜻합니다.
    state: absent
  # 이 작업만 대상 서버 대신 control(localhost)에서 실행합니다.
  delegate_to: localhost
# 실행 로그에 표시할 작업 이름입니다.
- name: 서비스 디렉터리 수집
  # rsync로 디렉터리를 동기화합니다. pull은 수집, push는 업로드입니다.
  ansible.posix.synchronize:
    # 원본 서버에서 control로 가져옵니다.
    mode: pull
    # 전송할 원본 경로입니다. 끝의 /는 폴더 자체가 아닌 내부 내용을 전송한다는 뜻입니다.
    src: '{{ service.source_path | default(service.path) }}/'
    # 전송 결과 또는 생성 파일을 저장할 목적지 경로입니다.
    dest: '{{ collection_root }}/common_services/{{ service.name }}/files/'
    # rsync archive 모드로 재귀 복사하며 권한·시간·심볼릭 링크 등을 보존합니다.
    archive: true
    # rsync에서 원본 소유자·그룹을 강제로 보존하지 않습니다.
    owner: false
    # rsync에서 원본 소유자·그룹을 강제로 보존하지 않습니다.
    group: false
    # 전송 원본에 없는 항목을 전송 목적지에서 삭제합니다. 수집본 또는 staging 범위에 적용됩니다.
    delete: true
    # Ansible에 설정된 SSH 연결 옵션을 rsync에도 전달합니다.
    use_ssh_args: true
    # SSH known_hosts를 이용해 접속 서버의 호스트 키를 확인합니다.
    verify_host: true
    # excludes 각 항목을 --exclude=패턴으로 만들고, 이미 수집된 제외 대상도 지우도록 --delete-excluded를 추가합니다.
    rsync_opts: '{{ [''--delete-excluded''] + ([''--exclude=''] | product(service.excludes | default([])) | map(''join'') | list) }}'
# 실행 로그에 표시할 작업 이름입니다.
- name: 서비스 수집 완료 표시
  # 지정한 내용을 파일로 기록합니다. 여기서는 수집 완료 표시를 만듭니다.
  ansible.builtin.copy:
    # 완료 표시 파일에 원본 서버의 inventory 이름을 기록합니다. 아래 여러 줄은 하나의 문자열입니다.
    content: '{{ inventory_hostname }}

      '
    # 전송 결과 또는 생성 파일을 저장할 목적지 경로입니다.
    dest: '{{ collection_root }}/common_services/{{ service.name }}/.complete'
    # 소유자만 읽기·쓰기 가능한 파일 권한입니다.
    mode: '0600'
  # 이 작업만 대상 서버 대신 control(localhost)에서 실행합니다.
  delegate_to: localhost
