# 키 계정으로 rsync할 수 있도록 개발자 SSH + sudo로 사본만 준비합니다.
---
- name: 원본 전송 계정 확인
  ansible.builtin.command:
    argv: [id, -un]
  register: source_reader
  changed_when: false
- name: 원본 전송 그룹 확인
  ansible.builtin.command:
    argv: [id, -gn]
  register: source_reader_group
  changed_when: false
- name: 개발자 계정으로 원본 사본 준비
  delegate_to: '{{ inventory_hostname }}__developer'
  become: true
  become_method: sudo
  become_user: root
  no_log: true
  block:
    - name: 전송 계정 전용 staging 준비
      ansible.builtin.file:
        path: '{{ source_staging_root }}'
        state: directory
        owner: '{{ source_reader.stdout }}'
        group: '{{ source_reader_group.stdout }}'
        mode: '0700'
    - name: 이번 수집의 임시 폴더 생성
      ansible.builtin.tempfile:
        state: directory
        path: '{{ source_staging_root }}'
        prefix: source-
      register: source_export
    - name: nginx 설정과 정적 파일 사본 생성
      ansible.builtin.copy:
        # 끝의 /는 원본 폴더 안의 내용을 복사한다는 뜻입니다.
        src: '{{ item.src }}/'
        dest: '{{ source_export.path }}/{{ item.name }}/'
        remote_src: true
        mode: preserve
        # 외부를 가리키는 심볼릭 링크는 따라가지 않습니다.
        local_follow: false
        follow: false
      loop:
        - {name: nginx, src: '{{ nginx_source_config_dir }}'}
        - {name: static, src: '{{ nginx_source_static_dir }}'}
    - name: 사본의 소유권만 전송 계정으로 변경
      ansible.builtin.file:
        path: '{{ source_export.path }}'
        owner: '{{ source_reader.stdout }}'
        group: '{{ source_reader_group.stdout }}'
        recurse: true
        follow: false
    - name: 사본 상위 폴더 접근 제한
      ansible.builtin.file:
        path: '{{ source_export.path }}'
        mode: '0700'
