# Ansible YAML: 들여쓰기는 소속 관계, -는 목록 항목, {{ 변수 }}는 실행 시 값 치환을 뜻합니다.
---
# 실행 로그에 표시할 작업 이름입니다.
- name: control에 수집본 보관 디렉터리 준비
  # 파일 또는 디렉터리의 존재 여부와 권한을 관리합니다.
  ansible.builtin.file:
    # 작업이 조회하거나 만들 경로입니다. {{ }} 안의 변수는 실제 경로로 치환됩니다.
    path: '{{ collection_root }}'
    # directory는 디렉터리 생성·유지, absent는 해당 경로 삭제를 뜻합니다.
    state: directory
    # 소유자만 읽기·쓰기·진입 가능한 디렉터리 권한입니다.
    mode: '0700'
  # 이 작업만 대상 서버 대신 control(localhost)에서 실행합니다.
  delegate_to: localhost
# 실행 로그에 표시할 작업 이름입니다.
- name: 수집 중 실패하면 이전 완료 표시를 사용하지 않도록 제거
  # 파일 또는 디렉터리의 존재 여부와 권한을 관리합니다.
  ansible.builtin.file:
    # 작업이 조회하거나 만들 경로입니다. {{ }} 안의 변수는 실제 경로로 치환됩니다.
    path: '{{ collection_root }}/.complete'
    # directory는 디렉터리 생성·유지, absent는 해당 경로 삭제를 뜻합니다.
    state: absent
  # 이 작업만 대상 서버 대신 control(localhost)에서 실행합니다.
  delegate_to: localhost
# 같은 실행에서 앞선 원본의 작업 경로가 남지 않게 초기화합니다.
- name: 이번 수집용 임시 경로 초기화
  ansible.builtin.set_fact:
    source_export: {}
- name: 관리자 사본 준비 후 일반 계정으로 rsync 수집
  block:
    - name: 원본의 보호된 파일을 수집용 사본으로 준비
      ansible.builtin.include_tasks: prepare-source.yml
      when: nginx_source_use_sudo | bool
    # 실행 로그에 표시할 작업 이름입니다.
    - name: source의 nginx 설정을 rsync로 control에 가져오기
      # rsync로 디렉터리를 동기화합니다. pull은 수집, push는 업로드입니다.
      ansible.posix.synchronize:
        # 원본 서버에서 control로 가져옵니다.
        mode: pull
        # 전송할 원본 경로입니다. 끝의 /는 폴더 자체가 아닌 내부 내용을 전송한다는 뜻입니다.
        src: '{{ source_export.stdout + "/nginx/" if nginx_source_use_sudo | bool else nginx_source_config_dir + "/" }}'
        # 전송 결과 또는 생성 파일을 저장할 목적지 경로입니다.
        dest: '{{ collection_root }}/nginx/'
        # 전송 원본에 없는 항목을 전송 목적지에서 삭제합니다. 수집본 또는 staging 범위에 적용됩니다.
        delete: true
        # rsync archive 모드로 재귀 복사하며 권한·시간·심볼릭 링크 등을 보존합니다.
        archive: true
        # rsync에서 원본 소유자·그룹을 강제로 보존하지 않습니다.
        owner: false
        # rsync에서 원본 소유자·그룹을 강제로 보존하지 않습니다.
        group: false
        # Ansible에 설정된 SSH 연결 옵션을 rsync에도 전달합니다.
        use_ssh_args: true
        # SSH known_hosts를 이용해 접속 서버의 호스트 키를 확인합니다.
        verify_host: true
    # 실행 로그에 표시할 작업 이름입니다.
    - name: source의 정적 파일 전체를 rsync로 control에 가져오기
      # rsync로 디렉터리를 동기화합니다. pull은 수집, push는 업로드입니다.
      ansible.posix.synchronize:
        # 원본 서버에서 control로 가져옵니다.
        mode: pull
        # 전송할 원본 경로입니다. 끝의 /는 폴더 자체가 아닌 내부 내용을 전송한다는 뜻입니다.
        src: '{{ source_export.stdout + "/static/" if nginx_source_use_sudo | bool else nginx_source_static_dir + "/" }}'
        # 전송 결과 또는 생성 파일을 저장할 목적지 경로입니다.
        dest: '{{ collection_root }}/static/'
        # 전송 원본에 없는 항목을 전송 목적지에서 삭제합니다. 수집본 또는 staging 범위에 적용됩니다.
        delete: true
        # rsync archive 모드로 재귀 복사하며 권한·시간·심볼릭 링크 등을 보존합니다.
        archive: true
        # rsync에서 원본 소유자·그룹을 강제로 보존하지 않습니다.
        owner: false
        # rsync에서 원본 소유자·그룹을 강제로 보존하지 않습니다.
        group: false
        # Ansible에 설정된 SSH 연결 옵션을 rsync에도 전달합니다.
        use_ssh_args: true
        # SSH known_hosts를 이용해 접속 서버의 호스트 키를 확인합니다.
        verify_host: true
  # 수집 도중 실패해도 생성한 사본은 삭제합니다. 강제 종료·연결 단절 시에는 수동 정리가 필요할 수 있습니다.
  always:
    - name: 원본 임시 사본 정리
      ansible.builtin.include_tasks: cleanup-source.yml
      when:
        - nginx_source_use_sudo | bool
        - source_export.stdout is defined
        - source_export is succeeded
# 실행 로그에 표시할 작업 이름입니다.
- name: 수집 성공 표시
  # 지정한 내용을 파일로 기록합니다. 여기서는 수집 완료 표시를 만듭니다.
  ansible.builtin.copy:
    # 완료 표시 파일에 원본 서버의 inventory 이름을 기록합니다. 아래 여러 줄은 하나의 문자열입니다.
    content: 'source={{ inventory_hostname }}

      '
    # 전송 결과 또는 생성 파일을 저장할 목적지 경로입니다.
    dest: '{{ collection_root }}/.complete'
    # 소유자만 읽기·쓰기 가능한 파일 권한입니다.
    mode: '0600'
  # 이 작업만 대상 서버 대신 control(localhost)에서 실행합니다.
  delegate_to: localhost
# 실행 로그에 표시할 작업 이름입니다.
- name: 수집본 위치 안내
  # 작업 결과나 경로를 화면에 출력합니다.
  ansible.builtin.debug:
    # 화면에 출력할 문자열입니다. {{ 변수 }} 부분은 실제 값으로 치환됩니다.
    msg: '수집 완료: {{ collection_root }}/ (nginx 설정과 static 파일)'
