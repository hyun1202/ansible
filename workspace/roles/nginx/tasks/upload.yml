---
- name: 성공한 수집본인지 확인
  ansible.builtin.stat:
    path: '{{ collection_root }}/.complete'
  delegate_to: localhost
  run_once: true
  register: collection_complete
- name: 수집 완료 표시가 없으면 중단
  ansible.builtin.assert:
    that: collection_complete.stat.exists
    fail_msg: 먼저 fetch.yml 또는 v1/fetch-nginx.yml을 실행하여 수집을 완료하세요.
  run_once: true
- name: deploy 전용 업로드 폴더 준비
  ansible.builtin.file:
    path: '{{ staging_root }}'
    state: directory
    mode: '0700'
- name: nginx 설정과 정적 파일 전체를 임시 폴더에 업로드
  ansible.posix.synchronize:
    mode: push
    src: '{{ collection_root }}/{{ item }}/'
    dest: '{{ staging_root }}/{{ item }}/'
    archive: true
    owner: false
    group: false
    delete: true
    use_ssh_args: true
    verify_host: true
  loop:
  - nginx
  - static
