# Ansible YAML: 들여쓰기는 소속 관계, -는 목록 항목, {{ 변수 }}는 실행 시 값 치환을 뜻합니다.
---
# 이 항목의 이름입니다.
- name: Rocky 8 필수 패키지와 Java 11 준비
  # inventory에서 이 그룹에 속한 서버들을 실행 대상으로 선택합니다.
  hosts: lab
  # false이면 OS 정보 등을 자동 수집하는 setup 작업을 생략합니다.
  gather_facts: false
  # 한 서버에서 처리하지 못한 오류가 나면 다른 서버의 후속 작업도 중단합니다.
  any_errors_fatal: true
  # 신규 서버를 한 대씩 순서대로 반영합니다.
  serial: 1
  # 실행 시 계정명과 비밀번호를 입력받아 각 name의 변수에 저장합니다.
  vars_prompt:
  # 이 항목의 이름입니다.
  - name: admin_user
    # 터미널에 표시할 입력 안내 문구입니다.
    prompt: su로 전환할 계정명
    # 입력 없이 Enter를 누르면 사용하는 기본값입니다.
    default: adminuser
    # true는 입력값을 화면에 숨기고, false는 입력한 글자를 보여줍니다.
    private: false
  # 이 항목의 이름입니다.
  - name: admin_su_password
    # 터미널에 표시할 입력 안내 문구입니다.
    prompt: 전환할 계정의 su 비밀번호
    # true는 입력값을 화면에 숨기고, false는 입력한 글자를 보여줍니다.
    private: true
  # 이 항목의 이름입니다.
  - name: admin_sudo_password
    # 터미널에 표시할 입력 안내 문구입니다.
    prompt: 전환한 계정의 sudo 비밀번호 (실습에서는 su와 동일)
    # true는 입력값을 화면에 숨기고, false는 입력한 글자를 보여줍니다.
    private: true
  # 이 범위에서 사용할 변수 값을 지정합니다.
  vars:
    # 입력받은 su 비밀번호를 Ansible 계정 전환에 사용합니다.
    ansible_become_password: '{{ admin_su_password }}'
  # 아래 YAML 파일에서 경로와 서비스 목록 변수를 읽습니다.
  vars_files:
  - vars/environment.yml
  - vars/services.yml
  # sudo 실행 옵션을 공통 변수에서 읽습니다.
  - vars/execution.yml
  # install.yml 단독 실행 때도 OS와 계정·공간을 확인합니다.
  pre_tasks:
    - name: 대상 사전 검사
      ansible.builtin.import_tasks: tasks/preflight-target.yml
  tasks:
    - name: 설치할 패키지 목록 결정
      ansible.builtin.set_fact:
        required_packages: '{{ bootstrap_packages + (["nginx"] if "nginx" in enabled_roles else []) }}'
    - name: 현재 설치된 패키지 조회
      ansible.builtin.command:
        argv: [rpm, -q, '{{ item }}']
      loop: '{{ required_packages }}'
      register: package_queries
      # rpm -q의 1은 미설치입니다. 다른 오류만 실패 처리합니다.
      failed_when: package_queries.rc not in [0, 1]
      changed_when: false
    - name: 미설치 패키지만 선택
      ansible.builtin.set_fact:
        missing_packages: '{{ package_queries.results | selectattr("rc", "equalto", 1) | map(attribute="item") | list }}'
    - name: 설치 예정 안내
      ansible.builtin.debug:
        msg: '누락된 패키지: {{ missing_packages }}'
    - name: su 전환 후 sudo로 설치
      # SSH 계정 → su 관리자 일반 계정 → sudo root 순서를 유지합니다.
      become: true
      become_method: su
      become_user: '{{ admin_user }}'
      no_log: true
      block:
        - name: 누락된 패키지 설치
          ansible.builtin.command:
            # 비밀번호는 명령 인자가 아닌 표준 입력으로 전달합니다.
            argv: '{{ sudo_root_argv + ["dnf", "install", "-y"] + missing_packages }}'
            stdin: '{{ admin_sudo_password }}'
          when: missing_packages | length > 0
        - name: 실제 서버의 nginx 자동 시작 준비
          ansible.builtin.command:
            argv: >-
              {{ sudo_root_argv + ["systemctl", "enable", "--now", "nginx"] }}
            stdin: '{{ admin_sudo_password }}'
          # 컨테이너에서는 entrypoint가 nginx를 실행하므로 systemctl을 쓰지 않습니다.
          when:
            - '"nginx" in enabled_roles'
            - ansible_facts.service_mgr == 'systemd'
      rescue:
        - name: 패키지 준비 실패 안내
          ansible.builtin.fail:
            msg: 패키지 준비 실패. su·sudo 권한, DNF 저장소 연결 및 서버의 dnf 로그를 확인하세요.
          no_log: false
    - name: Java 11 실행 확인
      ansible.builtin.command:
        argv: ['{{ java_home }}/bin/java', -version]
      register: java_version
      changed_when: false
      # 다른 Java가 설치되어 있어도 지정한 Java 11 경로의 실행 결과를 검사합니다.
      failed_when: java_version.rc != 0 or 'version "11.' not in java_version.stderr
    - name: Java 경로 안내
      ansible.builtin.debug:
        msg: '서비스 JAVA_HOME={{ java_home }} (시스템 기본 Java는 변경하지 않음)'
