# 개발자 계정으로 직접 SSH 접속한 뒤 sudo로 설치와 초기 폴더 준비를 수행합니다.
---
- name: Rocky 8 패키지와 서비스 폴더 준비
  hosts: lab
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars_files: [vars/environment.yml, vars/services.yml]
  pre_tasks:
    - name: 대상 개발자 접속 준비
      ansible.builtin.import_tasks: tasks/credentials.yml
      vars:
        credential_scope: target
    - name: 대상 사전 검사
      ansible.builtin.import_tasks: tasks/preflight-target.yml
  tasks:
    - name: 키 계정 이름 확인
      ansible.builtin.command:
        argv: [id, -un]
      register: target_reader
      changed_when: false
    - name: 키 계정 그룹 확인
      ansible.builtin.command:
        argv: [id, -gn]
      register: target_reader_group
      changed_when: false
    - name: 개발자 SSH와 sudo로 초기 준비
      delegate_to: '{{ inventory_hostname }}__developer'
      become: true
      become_method: sudo
      become_user: root
      block:
        - name: 설치할 패키지 목록 결정
          ansible.builtin.set_fact:
            required_packages: '{{ bootstrap_packages + (["nginx"] if "nginx" in enabled_roles else []) }}'
        - name: 현재 패키지 조회
          ansible.builtin.command:
            argv: [rpm, -q, '{{ item }}']
          loop: '{{ required_packages }}'
          register: package_queries
          changed_when: false
          failed_when: package_queries.rc not in [0, 1]
        - name: 누락된 패키지 선택
          ansible.builtin.set_fact:
            missing_packages: '{{ package_queries.results | selectattr("rc", "equalto", 1) | map(attribute="item") | list }}'
        # Rocky 8의 libdnf는 기본 Python 3.6용이므로 Ansible용 Python 3.9에서는 CLI를 사용합니다.
        # sudo 명령 문자열은 필요 없으며 become이 모듈 실행 권한을 처리합니다.
        - name: 누락된 패키지만 설치
          ansible.builtin.command:
            argv: '{{ ["dnf", "install", "-y"] + missing_packages }}'
          when: missing_packages | length > 0
        - name: 전송용 staging 상위 폴더 준비
          ansible.builtin.file:
            path: '{{ staging_root | dirname }}'
            state: directory
            owner: '{{ target_reader.stdout }}'
            group: '{{ target_reader_group.stdout }}'
            mode: '0700'
        - name: 업로드 폴더 준비
          ansible.builtin.file:
            path: '{{ staging_root }}'
            state: directory
            owner: '{{ target_reader.stdout }}'
            group: '{{ target_reader_group.stdout }}'
            mode: '0700'
        - name: 기존 서비스 폴더 확인
          ansible.builtin.stat:
            path: '{{ item.path }}'
          loop: '{{ common_services if "common_services" in enabled_roles else [] }}'
          register: service_directories
        - name: 새 서비스 폴더만 키 계정 소유로 준비
          ansible.builtin.file:
            path: '{{ item.item.path }}'
            state: directory
            owner: '{{ item.item.owner }}'
            group: '{{ item.item.group }}'
            mode: '0750'
          loop: '{{ service_directories.results }}'
          when: not item.stat.exists
          loop_control:
            label: '{{ item.item.path }}'
        - name: systemd 서버의 nginx 시작 준비
          ansible.builtin.systemd_service:
            name: nginx
            enabled: true
            state: started
          when:
            - '"nginx" in enabled_roles'
            - ansible_facts.service_mgr == 'systemd'
    - name: Java 11 확인
      ansible.builtin.command:
        argv: ['{{ java_home }}/bin/java', -version]
      register: java_version
      changed_when: false
      failed_when: java_version.rc != 0 or 'version "11.' not in java_version.stderr
