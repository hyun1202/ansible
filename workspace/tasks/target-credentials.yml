# install/apply를 따로 실행하면 입력받고, setup에서는 앞서 입력한 정보를 재사용합니다.
---
- name: 대상 관리자 정보 읽기
  ansible.builtin.include_tasks: read-credentials.yml
  vars:
    credential_scope: target
- name: 현재 대상 호스트에 관리자 정보 연결
  ansible.builtin.set_fact:
    admin_user: '{{ hostvars["localhost"].deployment_credentials.target.user }}'
    admin_su_password: '{{ hostvars["localhost"].deployment_credentials.target.su_password }}'
    admin_sudo_password: '{{ hostvars["localhost"].deployment_credentials.target.sudo_password }}'
    cacheable: false
  no_log: true
