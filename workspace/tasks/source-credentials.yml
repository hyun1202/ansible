# 원본 관리자 정보는 대상 관리자 정보와 별도로 보관합니다.
---
- name: 원본 관리자 정보 읽기
  ansible.builtin.include_tasks: read-credentials.yml
  vars:
    credential_scope: source
- name: 현재 원본 호스트에 관리자 정보 연결
  ansible.builtin.set_fact:
    source_admin_user: '{{ hostvars["localhost"].deployment_credentials.source.user }}'
    source_admin_su_password: '{{ hostvars["localhost"].deployment_credentials.source.su_password }}'
    source_admin_sudo_password: '{{ hostvars["localhost"].deployment_credentials.source.sudo_password }}'
    cacheable: false
  no_log: true
