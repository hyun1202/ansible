# 비밀번호는 파일에 저장하지 않고 실행 중 개발자 접속 별칭에만 연결합니다.
---
- name: source 개발자 접속 정보 읽기
  ansible.builtin.include_tasks: read-credentials.yml
  vars:
    credential_scope: source
- name: 개발자 SSH 연결 등록
  ansible.builtin.include_tasks: developer-hosts.yml
  vars:
    credential_scope: source
    connection_group: config_sources
