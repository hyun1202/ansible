# service는 상위 loop에서 전달한 현재 서비스 항목입니다.
---
- name: 공통 서비스 원본 폴더 확인
  ansible.builtin.command:
    argv: [/usr/bin/python3.9, -c, 'import os,sys; p=sys.argv[1]; sys.exit(0 if os.path.isdir(p) and os.access(p,os.R_OK|os.X_OK) else 1)', '{{ service.source_path | default(service.path) }}']
  changed_when: false
- name: 시작과 종료 스크립트 실행 권한 확인
  ansible.builtin.command:
    # ./start.sh 등 첫 번째 인자를 원본 폴더 기준으로 확인합니다.
    argv: [test, -x, '{{ service.source_path | default(service.path) }}/{{ item[0] }}']
  loop: '{{ [service.start_argv | default([]), service.stop_argv | default([])] | reject("equalto", []) | list }}'
  changed_when: false
- name: 정상 동작 검증 미설정 안내
  ansible.builtin.debug:
    msg: '{{ service.name }}은 시작 명령만 실행합니다. check_argv가 없어 정상 동작 여부는 직접 확인해야 합니다.'
  when:
    - service.start_argv | default([]) | length > 0
    - service.check_argv | default([]) | length == 0
