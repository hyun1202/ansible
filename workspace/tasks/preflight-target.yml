# 신규 구축 대상의 OS·계정·공간을 검사합니다. 파일이나 패키지는 변경하지 않습니다.
---
- name: 대상 OS와 서비스 관리자 확인
  ansible.builtin.setup:
    # 필요한 fact만 수집합니다.
    gather_subset: [min]
- name: Rocky Linux 8 대상 확인
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Rocky'
      - ansible_facts.distribution_major_version == '8'
    fail_msg: 이 설치 흐름은 Rocky Linux 8용입니다. inventory 대상을 확인하세요.
- name: 서비스 소유 계정 확인
  ansible.builtin.command:
    argv: [getent, passwd, '{{ item.owner }}']
  loop: '{{ common_services }}'
  loop_control:
    label: '{{ item.name }}'
  when: '"common_services" in enabled_roles'
  changed_when: false
- name: 서비스 실행 계정 확인
  ansible.builtin.command:
    argv: [getent, passwd, '{{ item.start_user | default(item.owner) }}']
  loop: '{{ common_services }}'
  loop_control:
    label: '{{ item.name }}'
  when: '"common_services" in enabled_roles'
  changed_when: false
- name: 서비스 그룹 확인
  ansible.builtin.command:
    argv: [getent, group, '{{ item }}']
  loop: '{{ common_services | map(attribute="group") | unique | list }}'
  when: "'common_services' in enabled_roles"
  changed_when: false
- name: 대상 경로의 파일 시스템 여유 공간 조회
  ansible.builtin.command:
    # 경로가 아직 없으면 가장 가까운 기존 상위 경로의 여유 공간을 확인합니다.
    argv:
      - '{{ ansible_python_interpreter | default("/usr/bin/python3.9") }}'
      - -c
      - |
        import os
        import shutil
        import sys
        path = os.path.abspath(sys.argv[1])
        while not os.path.exists(path):
            path = os.path.dirname(path)
        print(shutil.disk_usage(path).free)
      - '{{ item }}'
  loop: '{{ ([staging_root] + ([nginx_config_dir, nginx_static_dir] if "nginx" in enabled_roles else []) + (common_services | map(attribute="path") | list if "common_services" in enabled_roles else [])) | unique }}'
  register: target_disk_checks
  changed_when: false
- name: 최소 여유 공간 확인
  ansible.builtin.assert:
    that: item.stdout | int >= minimum_free_bytes | int
    fail_msg: '{{ item.item }}의 여유 공간이 부족합니다. 백업·설치 용량을 고려해 확보하세요.'
  loop: '{{ target_disk_checks.results }}'
  loop_control:
    label: '{{ item.item }}'
# 기존 폴더가 있는 서비스는 교체 전에 종료할 수 있어야 합니다.
- name: 기존 서비스 종료 스크립트 확인
  ansible.builtin.command:
    argv:
      - '{{ ansible_python_interpreter | default("/usr/bin/python3.9") }}'
      - -c
      - 'import os,sys; p=sys.argv[1]; f=os.path.join(p,sys.argv[2]); sys.exit(0 if not os.path.exists(p) or (os.path.isfile(f) and os.access(f,os.X_OK)) else 1)'
      - '{{ item.path }}'
      - '{{ (item.stop_argv | default([]) | first) | default("") }}'
  loop: '{{ common_services }}'
  loop_control:
    label: '{{ item.name }}'
  when:
    - '"common_services" in enabled_roles'
    - item.stop_argv | default([]) | length > 0
  changed_when: false
