# credential_scope는 source 또는 target입니다. 입력값은 localhost의 메모리에만 보관합니다.
# 같은 ansible-playbook 실행 안에서는 다음 단계가 캐시를 재사용합니다.
---
- name: '{{ credential_scope }} 개발자 접속 정보 준비'
  # 비밀번호 입력값과 fact는 실행 로그에 출력하지 않습니다.
  no_log: true
  run_once: true
  vars:
    credential_prefix: '{{ "source_admin" if credential_scope == "source" else "admin" }}'
    credential_label: '{{ "원본 서버" if credential_scope == "source" else "대상 서버" }}'
    supplied_user: '{{ vars.get(credential_prefix + "_user", "") }}'
    supplied_ssh: '{{ vars.get(credential_prefix + "_ssh_password", "") }}'
    supplied_sudo: '{{ vars.get(credential_prefix + "_sudo_password", "") }}'
  when: credential_scope not in (hostvars['localhost'].deployment_credentials | default({}))
  block:
    - name: '{{ credential_label }} 개발자 계정 입력'
      ansible.builtin.pause:
        prompt: '{{ credential_label }} SSH 계정명 [adminuser]'
        echo: true
      when: supplied_user | length == 0
      register: credential_user_answer
    - name: '{{ credential_label }} SSH 비밀번호 입력'
      ansible.builtin.pause:
        prompt: '{{ credential_label }} SSH 비밀번호'
        echo: false
      when: supplied_ssh | length == 0
      register: credential_ssh_answer
    - name: '{{ credential_label }} sudo 비밀번호 입력'
      ansible.builtin.pause:
        prompt: '{{ credential_label }} sudo 비밀번호 (실습에서는 SSH와 동일)'
        echo: false
      when: supplied_sudo | length == 0
      register: credential_sudo_answer
    - name: 입력값을 실행 중 메모리에 보관
      ansible.builtin.set_fact:
        deployment_credentials: >-
          {{ (hostvars['localhost'].deployment_credentials | default({})) |
             combine({credential_scope: {
               'user': supplied_user or (credential_user_answer.user_input | default('', true)) or 'adminuser',
               'ssh_password': supplied_ssh or (credential_ssh_answer.user_input | default('', true)),
               'sudo_password': supplied_sudo or (credential_sudo_answer.user_input | default('', true))
             }}) }}
        # 디스크의 fact cache에는 저장하지 않습니다.
        cacheable: false
      delegate_to: localhost
      delegate_facts: true
    - name: 비어 있는 비밀번호 차단
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].deployment_credentials[credential_scope].ssh_password | length > 0
          - hostvars['localhost'].deployment_credentials[credential_scope].sudo_password | length > 0
        fail_msg: 대화형 터미널에서 비밀번호를 입력하세요. 비대화형 실행은 Vault 등으로 인증 변수를 제공하세요.
  rescue:
    - name: 인증 입력 실패 안내
      ansible.builtin.fail:
        msg: '{{ credential_label }} 인증 정보를 받지 못했습니다. 대화형 터미널에서 비밀번호를 입력하거나 Vault 등으로 인증 변수를 제공하세요.'
      # 비밀번호나 입력값을 포함하지 않는 안내만 표시합니다.
      no_log: false

# 입력한 정보로 개발자 SSH 접속 별칭을 등록합니다. 원래 키 접속 설정은 유지합니다.
- name: 개발자 비밀번호 SSH 접속 별칭 생성
  ansible.builtin.add_host:
    name: '{{ item }}__developer'
    ansible_host: '{{ hostvars[item].ansible_host | default(item) }}'
    ansible_port: '{{ hostvars[item].ansible_port | default(22) }}'
    ansible_user: '{{ hostvars["localhost"].deployment_credentials[credential_scope].user }}'
    ansible_password: '{{ hostvars["localhost"].deployment_credentials[credential_scope].ssh_password }}'
    ansible_become_password: '{{ hostvars["localhost"].deployment_credentials[credential_scope].sudo_password }}'
    ansible_python_interpreter: '{{ hostvars[item].ansible_python_interpreter | default("/usr/bin/python3.9") }}'
    # 호스트 키 검증 옵션은 원래 연결 설정을 유지합니다. 개발자 접속은 비밀번호만 사용합니다.
    ansible_ssh_common_args: '{{ hostvars[item].ansible_ssh_common_args | default("") }}'
    ansible_ssh_extra_args: '-o PreferredAuthentications=password -o PubkeyAuthentication=no'
  # source는 원본 그룹, target은 대상 그룹의 접속을 등록합니다.
  loop: '{{ groups["config_sources" if credential_scope == "source" else "lab"] }}'
  # add_host는 controller 메모리 작업입니다. 입력값은 로그에 남기지 않습니다.
  no_log: true
  changed_when: false
