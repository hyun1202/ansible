# Ansible YAML: 들여쓰기는 소속 관계, -는 목록 항목, {{ 변수 }}는 실행 시 값 치환을 뜻합니다.
---
# 예시: 원본과 신규 서버 모두 /home/deploy 아래에 서비스가 있다고 가정합니다.
# 실제 폴더를 생성하거나 실행하는 설정은 아닙니다. 수집 전에 경로를 확인하세요.
# 소유자와 실행 계정은 모두 deploy로 가정합니다.
# start_argv와 check_argv는 실제 스크립트 이름을 확인한 뒤 채우세요.
# 제외 목록도 예시이므로 서비스의 실제 로그·데이터 경로에 맞춰 수정하세요.
# 공통 role로 처리할 서비스 목록입니다. 각 항목에 fetch → upload → apply를 적용하며 []이면 대상이 없습니다.
common_services:
  # 서비스 식별자입니다. 수집·업로드 폴더 이름으로 사용하므로 중복되면 안 됩니다.
  - name: loki
    # 신규 서버의 최종 서비스 경로입니다. source_path가 없으면 원본에서도 이 경로로 수집합니다.
    path: /home/deploy/loki
    # 최종 파일에 설정할 소유 계정입니다. 대상 서버에 미리 존재해야 합니다.
    owner: deploy
    # 최종 파일에 설정할 소유 그룹입니다. 대상 서버에 미리 존재해야 합니다.
    group: deploy
    # 수집에서 제외할 rsync 패턴 목록입니다. []이면 별도 제외 패턴이 없습니다.
    excludes: ["logs/", "data/", "wal/"]
    # 시작·확인 명령을 실행할 계정입니다. 생략하면 owner를 사용합니다.
    start_user: deploy
    # 실행 파일과 인자를 순서대로 적습니다. []이면 파일만 배치하고 시작 명령은 생략합니다.
    start_argv: []  # 예: ["./start.sh"]
    # 기동 확인 명령과 인자입니다. 종료 코드 0을 성공으로 보고, []이면 확인 명령은 생략합니다.
    check_argv: []  # 예: ["./check.sh"]

  # 서비스 식별자입니다. 수집·업로드 폴더 이름으로 사용하므로 중복되면 안 됩니다.
  - name: alloy
    # 신규 서버의 최종 서비스 경로입니다. source_path가 없으면 원본에서도 이 경로로 수집합니다.
    path: /home/deploy/alloy
    # 최종 파일에 설정할 소유 계정입니다. 대상 서버에 미리 존재해야 합니다.
    owner: deploy
    # 최종 파일에 설정할 소유 그룹입니다. 대상 서버에 미리 존재해야 합니다.
    group: deploy
    # 수집에서 제외할 rsync 패턴 목록입니다. []이면 별도 제외 패턴이 없습니다.
    excludes: ["logs/", "data/"]
    # 시작·확인 명령을 실행할 계정입니다. 생략하면 owner를 사용합니다.
    start_user: deploy
    # 실행 파일과 인자를 순서대로 적습니다. []이면 파일만 배치하고 시작 명령은 생략합니다.
    start_argv: []  # 예: ["./start.sh"]
    # 기동 확인 명령과 인자입니다. 종료 코드 0을 성공으로 보고, []이면 확인 명령은 생략합니다.
    check_argv: []

  # 서비스 식별자입니다. 수집·업로드 폴더 이름으로 사용하므로 중복되면 안 됩니다.
  - name: scouter
    # 신규 서버의 최종 서비스 경로입니다. source_path가 없으면 원본에서도 이 경로로 수집합니다.
    path: /home/deploy/scouter
    # 최종 파일에 설정할 소유 계정입니다. 대상 서버에 미리 존재해야 합니다.
    owner: deploy
    # 최종 파일에 설정할 소유 그룹입니다. 대상 서버에 미리 존재해야 합니다.
    group: deploy
    # 수집에서 제외할 rsync 패턴 목록입니다. []이면 별도 제외 패턴이 없습니다.
    excludes: ["logs/", "database/"]
    # 시작·확인 명령을 실행할 계정입니다. 생략하면 owner를 사용합니다.
    start_user: deploy
    # 실행 파일과 인자를 순서대로 적습니다. []이면 파일만 배치하고 시작 명령은 생략합니다.
    start_argv: []  # 예: ["./startup.sh"] 또는 ["./agent.host/host.sh"]
    # 기동 확인 명령과 인자입니다. 종료 코드 0을 성공으로 보고, []이면 확인 명령은 생략합니다.
    check_argv: []

  # 서비스 식별자입니다. 수집·업로드 폴더 이름으로 사용하므로 중복되면 안 됩니다.
  - name: node_exporter
    # 신규 서버의 최종 서비스 경로입니다. source_path가 없으면 원본에서도 이 경로로 수집합니다.
    path: /home/deploy/node_exporter
    # 최종 파일에 설정할 소유 계정입니다. 대상 서버에 미리 존재해야 합니다.
    owner: deploy
    # 최종 파일에 설정할 소유 그룹입니다. 대상 서버에 미리 존재해야 합니다.
    group: deploy
    # 수집에서 제외할 rsync 패턴 목록입니다. []이면 별도 제외 패턴이 없습니다.
    excludes: ["logs/"]
    # 시작·확인 명령을 실행할 계정입니다. 생략하면 owner를 사용합니다.
    start_user: deploy
    # 실행 파일과 인자를 순서대로 적습니다. []이면 파일만 배치하고 시작 명령은 생략합니다.
    start_argv: []  # 예: ["./start.sh"]
    # 기동 확인 명령과 인자입니다. 종료 코드 0을 성공으로 보고, []이면 확인 명령은 생략합니다.
    check_argv: []

  # 서비스 식별자입니다. 수집·업로드 폴더 이름으로 사용하므로 중복되면 안 됩니다.
  - name: deploy_scripts
    # 신규 서버의 최종 서비스 경로입니다. source_path가 없으면 원본에서도 이 경로로 수집합니다.
    path: /home/deploy/deploy
    # 최종 파일에 설정할 소유 계정입니다. 대상 서버에 미리 존재해야 합니다.
    owner: deploy
    # 최종 파일에 설정할 소유 그룹입니다. 대상 서버에 미리 존재해야 합니다.
    group: deploy
    # 수집에서 제외할 rsync 패턴 목록입니다. []이면 별도 제외 패턴이 없습니다.
    excludes: []
    # 실행 파일과 인자를 순서대로 적습니다. []이면 파일만 배치하고 시작 명령은 생략합니다.
    start_argv: []  # 배포 쉘은 복사만 하고 자동 실행하지 않습니다.
    # 기동 확인 명령과 인자입니다. 종료 코드 0을 성공으로 보고, []이면 확인 명령은 생략합니다.
    check_argv: []

# 원본 경로만 다르면 해당 항목에 source_path를 추가하세요.
# source_path: /원본서버의/서비스폴더
# 원본과 신규 서버가 같으면 path 하나만 있으면 됩니다.
