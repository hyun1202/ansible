# Ansible YAML: 들여쓰기는 소속 관계, -는 목록 항목, {{ 변수 }}는 실행 시 값 치환을 뜻합니다.
---
# 실행할 role. 하나만 실행하려면 목록에서 다른 항목을 빼세요.
# 실행할 role 목록입니다. nginx만 원하면 [nginx]로 지정합니다.
enabled_roles: [nginx, common_services]

# control과 신규 서버에서 사용하는 공통 경로
# control의 수집본 경로입니다. playbook_dir는 실행 플레이북이 있는 디렉터리입니다.
collection_root: "{{ playbook_dir }}/collected"
# 신규 서버에서 SSH 일반 계정이 먼저 파일을 업로드할 임시 경로입니다.
staging_root: /home/deploy/staging

# nginx 원본·대상 경로 (같으면 source 변수는 아래 값을 그대로 참조)
# 신규 서버에 최종 배치할 nginx 설정 디렉터리입니다.
nginx_config_dir: /etc/nginx
# 신규 서버에 최종 배치할 HTML·CSS 등 정적 파일 디렉터리입니다.
nginx_static_dir: /usr/share/nginx/html
# 원본 서버에서 수집할 설정 경로입니다. {{ nginx_config_dir }}로 대상 경로 값을 재사용합니다.
nginx_source_config_dir: "{{ nginx_config_dir }}"
# 원본 서버에서 수집할 정적 파일 경로입니다. 대상과 다르면 원본 경로를 직접 적습니다.
nginx_source_static_dir: "{{ nginx_static_dir }}"
# 신규 서버에서 설정 검사(-t)와 reload(-s reload)에 사용할 실행 파일입니다.
nginx_binary: /usr/sbin/nginx
# 반영 후 신규 서버 내부에서 확인할 HTTP 기본 주소입니다.
nginx_check_base_url: http://127.0.0.1
# 기본 주소 뒤에 붙여 각각 HTTP 200 응답을 확인할 경로 목록입니다.
nginx_check_paths: [/, /static/app.css]

# 사전 검사의 최소 여유 공간입니다. 실제 수집본·백업 크기에 맞춰 늘리세요 (기본 1 GiB).
minimum_free_bytes: 1073741824
# 신규 구축 시 누락된 공통 패키지만 설치합니다. 이미 설치된 패키지는 업데이트하지 않습니다.
bootstrap_packages: [rsync, curl, acl, java-11-openjdk-headless]
# Java 11을 명시적으로 사용할 경로입니다. 시스템의 기본 Java 선택은 변경하지 않습니다.
java_home: /usr/lib/jvm/jre-11-openjdk

# true이면 원본에서 su → sudo로 nginx 설정·static 사본을 만든 뒤 일반 계정으로 수집합니다.
# 원본 SSH 계정이 모든 파일을 읽을 수 있으면 false로 직접 수집할 수 있습니다.
nginx_source_use_sudo: true
