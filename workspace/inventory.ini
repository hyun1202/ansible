# 파일 수집 원본입니다. fetch는 이 그룹에만 접속합니다.
[config_sources]
source ansible_host=source ansible_user=ansible

# 설치·업로드·반영 대상입니다. 원본 서버를 이 그룹에 넣지 마세요.
[lab]
target ansible_host=target ansible_python_interpreter=/usr/bin/python3.9
target2 ansible_host=target2 ansible_python_interpreter=/usr/bin/python3.9

[lab:vars]
ansible_user=deploy
